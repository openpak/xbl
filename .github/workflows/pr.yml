name: pr

# Contribution check: vet and test on pull requests and pushes to main.
# GitHub-hosted runner, read-only token, no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      XBL_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/xbox?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -count=1 ./...
